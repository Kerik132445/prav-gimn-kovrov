<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Золотистый радиальный градиент сияния -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FCD34D" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0.9"/>
    </radialGradient>
    <!-- Золотисто-красная кайма звезды -->
    <linearGradient id="starBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <!-- Мягкая тень для книги и креста -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0A195A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Восьмиконечная Вифлеемская / Богородичная звезда -->
  <!-- 8 лучей: N, NE, E, SE, S, SW, W, NW -->
  <polygon points="
    60,4   73,33  102,18 87,47
    116,60 87,73  102,102 73,87
    60,116 47,87  18,102 33,73
    4,60   33,47  18,18  47,33"
    fill="url(#starGlow)"
    stroke="url(#starBorder)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Внутреннее сияние / ореол звезды -->
  <polygon points="
    60,14  70,38  94,26  82,50
    106,60 82,70  94,94  70,82
    60,106 50,82  26,94  38,70
    14,60  38,50  26,26  50,38"
    fill="#FEF08A"
    fill-opacity="0.4"
  />

  <!-- Раскрытая книга (Азбука / Евангелие) -->
  <g filter="url(#shadow)">
    <!-- Страницы книги (фон) -->
    <path d="M 28,45 
             C 38,42 52,43 60,47 
             C 68,43 82,42 92,45 
             L 94,84 
             C 82,81 68,82 60,86 
             C 52,82 38,81 26,84 
             Z" 
          fill="#FFFFFF" 
          stroke="#1E3A8A" 
          stroke-width="2" 
          stroke-linejoin="round"
    />
    
    <!-- Переплет и разворот страниц -->
    <path d="M 60,47 L 60,86" stroke="#1E3A8A" stroke-width="1.75"/>
    <path d="M 29,86 C 40,83 52,84 60,87 C 68,84 80,83 91,86" fill="none" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- Славянские буквицы А (Аз) и Б (Буки) -->
    <!-- Левая страница: Буквица А -->
    <text x="43" y="73" 
          font-family="'Times New Roman', 'Old Standard TT', 'Georgia', serif" 
          font-size="24" 
          font-weight="bold" 
          fill="#DC2626" 
          text-anchor="middle">А</text>
    
    <!-- Правая страница: Буквица Б -->
    <text x="77" y="73" 
          font-family="'Times New Roman', 'Old Standard TT', 'Georgia', serif" 
          font-size="24" 
          font-weight="bold" 
          fill="#DC2626" 
          text-anchor="middle">Б</text>
  </g>

  <!-- Православный осьмиконечный крест -->
  <g filter="url(#shadow)">
    <!-- Сплошная синяя обводка креста (широкая) -->
    <!-- Основной вертикальный столб -->
    <rect x="56.5" y="15" width="7" height="88" rx="1" fill="#FFFFFF" stroke="#0A195A" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Верхняя перекладина (титулус) -->
    <rect x="50" y="27" width="20" height="5.5" rx="1" fill="#FFFFFF" stroke="#0A195A" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Средняя перекладина (главная широкая) -->
    <rect x="36" y="39" width="48" height="6.5" rx="1" fill="#FFFFFF" stroke="#0A195A" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Нижняя косая перекладина (подножие: левый край выше, правый ниже) -->
    <polygon points="48,81 72,89 71,94.5 47,86.5" fill="#FFFFFF" stroke="#0A195A" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Перезаливка центральных стыков белым для аккуратного соединения -->
    <rect x="57.5" y="28" width="5" height="3.5" fill="#FFFFFF"/>
    <rect x="57.5" y="40" width="5" height="4.5" fill="#FFFFFF"/>
    <polygon points="57.5,84 62.5,85.5 62.5,89 57.5,87.5" fill="#FFFFFF"/>
  </g>
</svg>
